<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NOVA — Think Beyond</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SCENE 1 -->
    <section class="hero">

        <div class="glow"></div>

        <div class="content">

            <p class="small-text">
                THE FUTURE IS HERE
            </p>

            <h1>NOVA</h1>

            <p class="tagline">
                Think Beyond.
            </p>

            <button onclick="explore()">
                ENTER THE FUTURE →
            </button>

        </div>

    </section>


    <!-- SCENE 2 -->
    <section class="scene-two">

        <div class="scene-content">

            <p>WHAT IF</p>

            <h2>
                ONE SECOND<br>
                COULD CHANGE<br>
                EVERYTHING?
            </h2>

            <span>
                THE FUTURE STARTS NOW.
            </span>

        </div>

    </section>


    <!-- SCENE 3 -->
    <section class="product-scene">

        <div class="product-light"></div>

        <div class="product-info">

            <p class="product-label">
                INTRODUCING THE NEW ERA
            </p>

            <div class="product-object">
                NOVA
            </div>

            <h2>
                BEYOND LIMITS.
            </h2>

            <p>
                Experience technology in a new dimension.
            </p>

        </div>

    </section>


    <!-- FINAL SCENE -->
    <section class="final-scene">

        <div class="final-content">

            <p>
                THE FUTURE IS NOT WAITING.
            </p>

            <h2>NOVA</h2>

            <span>
                THINK BEYOND.
            </span>

            <button onclick="restartAd()">
                WATCH AGAIN ↻
            </button>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
